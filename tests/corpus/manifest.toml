# Calibration corpus: the acceptance test for every change to finding triage.
#
# Only references live here. Each entry is fetched at test time from a pinned
# commit and must match `tree_hash` (_staging.tree_digest) before it is used.
#
# benign    -- public skills the raw scanner blocked although they are harmless
#              (false positives from the first update run, 2026-09-30). Fetched
#              through the pinned skills CLI like a real update.
# malicious -- inert attack samples (.invalid hosts only) kept in a separate
#              repository, so agent-guard's own tree never carries them.
#
# expect: "safe" or "dangerous" -- the final verdict after triage.
# needs_llm: the static scan alone finds nothing; only the LLM layer can.

